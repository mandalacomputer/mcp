name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Self-hosted, not ubuntu-latest -- a cost decision with an expiry date, not
    # an architecture one.
    #
    # This repository is private, so every GitHub-hosted job is metered against
    # the org's free-plan allowance, and billing rounds each job up to a whole
    # minute. The matrix is what makes that bite: four jobs per run, each far
    # shorter than the minute it is billed at. On the pool they are free.
    #
    # `portable` is a capability label carried by runner instances on both an
    # x64 host and an arm64 host, so a job lands on whichever is idle and either
    # host can be down without stalling CI. It is not an arch label: `runs-on`
    # is a strict filter with no priority ordering, so pinning to one
    # architecture would mean queueing for 24h rather than failing over.
    #
    # Floating is safe because nothing here escapes the runner: this workflow
    # builds and tests, and publishing happens elsewhere. Node ships linux-arm64
    # for every version in the matrix, so nothing is emulated.
    #
    # REVERT WHEN THIS REPO GOES PUBLIC. GitHub-hosted minutes are free and
    # unlimited for public repositories, and hosted runners are strictly better
    # for a matrix: its jobs run genuinely in parallel there, where the pool has
    # two instances for this repo and serialises them. Set
    # `runs-on: ubuntu-latest` back and delete the HOME isolation step, which
    # only exists because the pool's instances share a HOME.
    runs-on: [self-hosted, linux, portable]
    strategy:
      fail-fast: false
      matrix:
        # The floor is what package.json declares, and the ceiling is what an
        # `npx` on a current machine will actually use. A server people install
        # with npx is one whose Node range has to be true rather than aspirational.
        #
        # 26 is here because the ceiling being one major short was not a
        # theoretical gap. OPL-3842 made every request this server sends fail on
        # Node 26 — an undici Agent handed to a fetch from a different copy of
        # undici, which the runtime's own bundled 8.x rejects before opening a
        # socket — and nothing caught it: the matrix stopped at 24, and the suite
        # stands its own function in `globalThis.fetch` everywhere and so never
        # reaches the built-in one at all. A Node this server has never been run
        # on is a Node it can be wholly broken on with every check green.
        node: ['20', '22', '24', '26']
    steps:
      - uses: actions/checkout@v4
      # The pool's instances share one `actions` HOME, so they share ~/.npm with
      # every other repo's runner on the box. Give each instance its own;
      # RUNNER_NAME is unique per instance and an instance runs one job at a
      # time, so this serialises access while staying warm across runs. The
      # `cache: npm` above then fills a directory nothing else is writing to.
      - name: Isolate HOME per runner instance
        run: |
          h="$HOME/runner-home-$RUNNER_NAME"
          mkdir -p "$h"
          echo "HOME=$h" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
      # The published artifact is dist/, and a server whose bin does not start
      # is one nobody finds out about until they install it.
      - run: node dist/cli.js --help

  # There is no `surface:` job here any more. It checked the platform out and
  # ran scripts/check-surface.mjs, and for the whole of its life PLATFORM_REPO_TOKEN
  # was never set on this repository — so the checkout failed, continue-on-error
  # swallowed it, and every run printed the script's skip and passed. A green
  # job comparing nothing, which is the same bug as the mirror it was watching.
  #
  # The diff is enforced in the platform's CI instead, which checks this repo
  # out beside itself and runs this same script (OPL-3916). That is where the
  # secret belongs — one there that reads three SDKs, rather than a key to the
  # platform inside three repos — and where the output belongs, since what it
  # prints is routes and parameters that have not shipped yet.
