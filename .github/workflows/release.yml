name: Release

# A tag `vX.Y.Z` pushed to this repository publishes X.Y.Z to npm. Nothing
# else does: there is no token anywhere, npm trusts this workflow file in this
# repository through OpenID Connect (a "trusted publisher"), and the publish
# carries a provenance attestation linking the package to this run.
#
# The tag has to agree with package.json before anything is built; a mismatch
# fails the run rather than publishing one version under another's name. Tests
# run again here because CI runs on branches and this workflow runs on tags —
# and one of them holds plugin/.claude-plugin/plugin.json to the same number,
# so a release is four copies of the version agreeing, not three. server.json
# (the MCP Registry entry) names the version twice more and is checked here too.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Tag matches the declared version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(node -p "require('./package.json').version")
          server=$(grep -oE "SERVER_VERSION = '[^']+'" src/version.ts | sed -E "s/.*'([^']+)'/\\1/")
          registry=$(node -p "const s=require('./server.json'); s.version === s.packages[0].version ? s.version : 'mismatch'")
          echo "tag=$tag package.json=$declared src/version.ts=$server server.json=$registry"
          [ "$tag" = "$declared" ] && [ "$tag" = "$server" ] && [ "$tag" = "$registry" ]
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/mandala-computer-mcp/v/${{ github.ref_name }}
    permissions:
      id-token: write   # the OIDC token npm exchanges for a publish
      contents: write   # the GitHub release below
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later; the npm that ships with
      # Node is older.
      - run: npm install -g npm@latest && npm --version
      - run: npm ci
      - run: npm publish --access public
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pack
          gh release create "$GITHUB_REF_NAME" ./*.tgz --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

  # The MCP Registry lists io.github.mandalacomputer/mcp from server.json. It
  # is a job of its own for two reasons. It holds only what it needs: the OIDC
  # token that proves this workflow belongs to the org, a read-only checkout
  # with no persisted credential, and nothing that can write to the repository,
  # since it runs a binary downloaded from another project. And it can be
  # re-run alone: when it fails, "Re-run failed jobs" retries the listing
  # without trying to publish to npm again, which npm would refuse.
  registry:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Pinned by checksum as well as version: a release's assets can be
      # replaced after it is published. The sum is the one in the release's
      # registry_1.8.1_checksums.txt, and matched a download on 2026-10-15.
      - name: Install mcp-publisher
        run: |
          curl -fsSL --connect-timeout 10 --max-time 120 -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      # The registry validates the package by reading this version's document
      # back from npm and comparing its mcpName, and npm serves a new version
      # minutes after the publish (v0.13.1's listing was refused with a 404
      # five seconds after it). Wait for the same document, asked for the same
      # way, to carry the same name.
      - name: Wait for npm to serve the version
        timeout-minutes: 10
        run: |
          version="${GITHUB_REF_NAME#v}"
          name=$(node -p "require('./server.json').name")
          url="https://registry.npmjs.org/mandala-computer-mcp/$version"
          until [ "$(curl -fsS --connect-timeout 10 --max-time 30 -H 'Accept: application/json' "$url" \
                     | node -e 'let b="";process.stdin.on("data",c=>b+=c).on("end",()=>{try{process.stdout.write(JSON.parse(b).mcpName||"")}catch{}})')" = "$name" ]; do
            echo "npm does not serve $version with mcpName $name yet"
            sleep 15
          done
      # npm can answer this runner before it answers the registry, so the
      # publish itself is retried too, logging in afresh each time.
      - name: Publish to the MCP Registry
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            if ./mcp-publisher login github-oidc && ./mcp-publisher publish; then exit 0; fi
            echo "attempt $attempt failed"
            sleep 45
          done
          exit 1
